services:
  - type: web
    name: hisobchi-ai-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: RUN_BOT
        value: "1"

